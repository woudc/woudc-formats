[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "woudc-formats"
version = "0.3.1
description = "Python library for converting non-standard formats to WOUDC extended CSV format"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]
keywords = ["woudc", "Ozone", "O3", "Ultraviolet Radiation", "UV", "UV Index", "Dobson Units", "Archives", "World Data Centre", "Non-standard Format", "SHADOZ", "AMES", "BAS"]
authors = [
    {name = "Thinesh Sornalingam", email = "thinesh.sornalingam@ec.gc.ca"},
    {name = "Tom Kralidis", email = "tomkralidis@gmail.com"}
]
maintainers = [
    {name = "Tom Kralidis", email = "tomkralidis@gmail.com"},
    {name = "Kevin Ngai", email = "kevin.ngai@ec.gc.ca"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering :: Atmospheric Science"
]
dependencies = [
    "nappy",
    "numpy",
    "pyshadoz",
    "pywoudc",
    "woudc-extcsv"
]

[project.optional-dependencies]
dev = ["Cython", "flake8"]
release = ["build", "twine", "wheel"]

[project.scripts]
woudc-formats.py = "woudc_formats:cli"

[project.urls]
homepage = "https://github.com/woudc/woudc-formats"
source = "https://github.com/woudc/woudc-formats"
documentation = "https://github.com/woudc/woudc-formats"
issues = "https://github.com/woudc/woudc-formats/issues"

[tool.setuptools.package-data]
"woudc_formats.resources" = ["*.cfg", "*.txt"]
